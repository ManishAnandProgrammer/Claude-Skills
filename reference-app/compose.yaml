# Local dependencies: docker compose up -d
services:
  postgres:
    image: postgres:18
    command: postgres -c log_lock_waits=on -c deadlock_timeout=1s
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
  # sign-in:begin
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
  # sign-in:end
volumes:
  postgres-data:
