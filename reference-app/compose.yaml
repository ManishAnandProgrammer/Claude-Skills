# Local dependencies: docker compose up -d
# Host ports come from .env (the *_PORT values the app connects to), so two projects on one machine
# differ only in their .env.
services:
  postgres:
    image: postgres:18
    command: postgres -c log_lock_waits=on -c deadlock_timeout=1s
    environment:
      POSTGRES_DB: ${DB_NAME:?set DB_NAME in .env (see .env.example)}
      # tenancy:begin
      # # The cluster's superuser runs the init script only. The application connects as DB_USER and
      # # migrates as DB_OWNER_USER: the roles the script creates, as docs/tenancy-runbook.md does. Each
      # # is required: an empty one would leave a new volume half set up.
      # POSTGRES_USER: postgres
      # POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD:-postgres}
      # DB_USER: ${DB_USER:?set DB_USER in .env (see .env.example)}
      # DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      # DB_OWNER_USER: ${DB_OWNER_USER:?set DB_OWNER_USER in .env (see .env.example)}
      # DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?set DB_OWNER_PASSWORD in .env (see .env.example)}
      # tenancy:else
      POSTGRES_USER: ${DB_USER:?set DB_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env (see .env.example)}
      # tenancy:end
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      # tenancy:begin
      # # Runs once, when the data directory is new: the roles (schema per tenant: and the platform schema).
      # - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
      # tenancy:end
  # sign-in:begin
  redis:
    image: redis:8
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  # sign-in:end
  # media:begin
  # Uploaded files: an S3-compatible store, the image the tests use. Its posix backend keeps each
  # bucket as a top-level directory, so creating the directory creates the app's bucket.
  media-store:
    image: versity/versitygw:v1.11.0
    entrypoint: sh
    command: ["-c", "mkdir -p /data/$${MEDIA_BUCKET} && exec versitygw --health /health posix /data"]
    environment:
      ROOT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?set AWS_ACCESS_KEY_ID in .env (see .env.example)}
      ROOT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?set AWS_SECRET_ACCESS_KEY in .env (see .env.example)}
      VGW_REGION: ${MEDIA_REGION}
      MEDIA_BUCKET: ${MEDIA_BUCKET:?set MEDIA_BUCKET in .env (see .env.example)}
      # Browsers PUT files straight to the presigned URL from the UI's origin, so the store answers
      # CORS for it: versitygw's default for buckets without a CORS configuration of their own. One
      # origin: with several in CORS_ALLOWED_ORIGINS, put the one the UI uploads from here. A real
      # bucket gets its CORS rule from the owner (docs/runbook.md).
      VGW_CORS_ALLOW_ORIGIN: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "127.0.0.1:${MEDIA_PORT:-7070}:7070"
    volumes:
      - media-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7070/health"]
      interval: 5s
      timeout: 3s
      retries: 12
  # media:end
volumes:
  postgres-data:
  # media:begin
  media-data:
  # media:end
