# Tokens, secrets, CORS, the breached-password check.
app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:${spring.application.name}}
    # At most 15m (StartupChecks). A token is accepted up to 60 s past its expiry (the clock skew of
    # Spring's default JWT validators), so revocation takes at most TTL + 1 minute.
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:30d}
    # A refresh token presented again this soon after its rotation is a client duplicate (two tabs,
    # a retry after a timeout), not a leak: refused without revoking every session.
    rotation-grace: 30s
  security:
    # HMAC key for personal data in logs and rate-limit keys (PersonalDataHasher). No default.
    personal-data-pepper: ${PERSONAL_DATA_PEPPER}
    # bcrypt's cost: about 250 ms of CPU per sign-in at 12 (the admission group sign-in is sized for it).
    # A security decision, not a tunable: StartupChecks refuses any other value outside the test profile.
    password-hash-strength: 12
    # Signup refuses passwords from known breaches (Have I Been Pwned range API). Fail-open: while
    # the service is unreachable or the bulkhead below is full, signup proceeds and
    # breached_password.check.unavailable counts it.
    breached-passwords:
      enabled: ${BREACHED_PASSWORD_CHECK_ENABLED:true}
      api-url: https://api.pwnedpasswords.com/range/
      connect-timeout: 2s
      read-timeout: 3s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # session-version:begin
  # The session version's copy in Redis (SessionVersionService). Also the longest an old number stays
  # accepted when its bump's publish was lost (Redis unreachable right after the commit), or after an
  # operator changed a number in SQL without updating Redis (docs/runbook.md). A miss costs one read by
  # primary key.
  session-version:
    cache-ttl: 1m
  # session-version:end

resilience4j:
  # session-version:begin
  circuitbreaker:
    instances:
      # Redis reads and writes of the session version. Open (failures, or calls slower than Redis ever
      # is), the check skips Redis and reads the database by primary key, so a dead or hung Redis costs
      # no command timeout per request; a few probes after the wait close it again.
      session-version-cache:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 100ms
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 3
  # session-version:end
  bulkhead:
    instances:
      # Lookups in flight at once. A signup past it skips the check at once (no wait) rather than
      # hold its admission permit behind a slow service.
      breached-passwords:
        max-concurrent-calls: 4
        max-wait-duration: 0

logging:
  level:
    # Spring's checker logs every failed lookup at ERROR with a stack trace, then answers "not
    # compromised": an outage would flood the log. FailureCountingInterceptor logs one WARN instead.
    org.springframework.security.web.authentication.password.HaveIBeenPwnedRestApiPasswordChecker: OFF
