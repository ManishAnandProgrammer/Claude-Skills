# PostgreSQL, the connection pool, JPA and Liquibase; with the sign-in piece, Redis (the rate limiter's buckets).
spring:
  # sign-in:begin
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # One connection attempt. Connecting happens at startup and on the rate limiter's own
      # reconnect thread, never on a request, so this only bounds how long an attempt holds that thread.
      connect-timeout: 1s
      # Command timeout, the backstop just above app.rate-limit.backend-timeout (200ms): Bucket4j gives
      # up first and lets the request through; Lettuce's default (60s) would hold the command that long.
      timeout: 250ms
  # sign-in:end
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:${spring.application.name}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: ${spring.application.name}-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Fail fast: admission control is the queue; this is the backstop.
      connection-timeout: 3000
      validation-timeout: 1000
      keepalive-time: 30000
      idle-timeout: 120000
      max-lifetime: 1800000
      leak-detection-threshold: 30000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      # Together with provider_disables_autocommit and config/LazyConnectionConfig: a connection is
      # borrowed at the first statement, not when the transaction begins (read-only ones included).
      auto-commit: false
      data-source-properties:
        # Server-side limits for the app pool only (Liquibase opens its own connection).
        options: -c statement_timeout=25s -c lock_timeout=3s -c idle_in_transaction_session_timeout=30s
        # Greater than statement_timeout, so the server cancels first and the connection survives.
        socketTimeout: 30
        reWriteBatchedInserts: true
        tcpKeepAlive: true
        ApplicationName: ${spring.application.name}-${APP_ENV:local}
  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Liquibase owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
        jdbc:
          time_zone: UTC
          batch_size: 30
        order_inserts: true
        order_updates: true
        default_batch_fetch_size: 30
        query:
          # Hibernate 7.4 pages collection fetches in SQL and never trips this; kept as a guard.
          # The rule that matters: list pages never fetch collections (projections instead).
          fail_on_pagination_over_collection_fetch: true
          in_clause_parameter_padding: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  liquibase:
    # Liquibase opens its own connection (config/LiquibaseConnectionConfig), so the pool's
    # statement_timeout and lock_timeout above don't apply to migrations. No statement timeout: an
    # index build may take minutes. But a lock timeout: an ALTER TABLE waiting for its lock behind a
    # long read makes PostgreSQL queue every later query on that table behind the ALTER, and the
    # running application stalls on that table. With the timeout the migration fails fast (the
    # deployment stops; retry it once the read is gone) instead of holding everyone up.
    lock-timeout: ${LIQUIBASE_LOCK_TIMEOUT:5s}
    # The migration's session in pg_stat_activity (docs/runbook.md).
    application-name: ${spring.application.name}-liquibase
  # sign-in:begin
  redis:
    # Commands queued per connection before Lettuce refuses more (its default is unbounded). While
    # disconnected, commands are refused at once instead of buffered (RedisClientConfig).
    request-queue-size: 1000
  # sign-in:end
