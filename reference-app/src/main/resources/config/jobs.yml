# Scheduled jobs.
app:
  jobs:
    scheduler:
      # Platform threads shared by the @Scheduled jobs (SchedulingConfig).
      threads: 2
      # On shutdown, running jobs get this long to finish; within spring.lifecycle.timeout-per-shutdown-phase.
      shutdown-wait: 10s
    # Deletes expired refresh tokens (RefreshTokenPurgeJob), every night at 03:15 UTC.
    refresh-token-purge:
      cron: "0 15 3 * * *"
      # Tokens are deleted this long after they expired: by expiry, never by revocation, since a rotated token must
      # stay until it expires for its reuse to be seen.
      keep-after-expiry: 1d
      # Rows per statement, each statement its own short transaction.
      batch-size: 1000
    # change-history:begin
    # Deletes change history past its retention (ChangeHistoryPurgeJob), every night at 03:45 UTC.
    change-history-purge:
      cron: "0 45 3 * * *"
      # How long a change is kept: at least 90 days (a shorter value stops the startup). Set it to what the
      # project's compliance asks for.
      keep-for: 365d
      # Rows per statement, each statement its own short transaction.
      batch-size: 1000
    # change-history:end
    # media:begin
    # Confirms attached files whose upload URL has expired: present -> UPLOADED, absent -> MISSING.
    media-verification:
      cron: "0 */5 * * * *"
      batch-size: 200
      # A batch is this instance's for this long (lease_until); a crashed instance's rows are taken over after it.
      lease: 5m
    # Deletes removed files and never-attached uploads from storage, then their rows.
    media-cleanup:
      cron: "0 20 * * * *"
      batch-size: 200
      lease: 5m
    # media:end
