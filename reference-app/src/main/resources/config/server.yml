# Tomcat, threads, shutdown, API versions, request bodies, JSON input, API docs.
spring:
  threads:
    virtual:
      enabled: false
  task:
    execution:
      # SchedulingConfig's TaskScheduler is an Executor too; without force Boot would skip its async
      # executor, and the MDC TaskDecorator with it.
      mode: force
      thread-name-prefix: task-
  lifecycle:
    # Covers the normal request (3s pool wait + 25s statement timeout), not the rare worst case: a
    # signup or login runs several steps and can take about 60s. Owner's decision (REL-13, see the
    # review profile): the load balancer times out around 60s anyway, and a short, predictable drain
    # is safer for deployments.
    timeout-per-shutdown-phase: 30s
  mvc:
    formcontent:
      filter:
        # No endpoint reads form parameters: Boot's FormContentFilter would read a PUT, PATCH or DELETE
        # form body whole into memory, ahead of admission control and the security chain (CFG-04).
        enabled: false
    # Spring's API versioning; the parser (v1, v2, ...) is common/apiversion/MajorVersionParser.
    apiversion:
      use:
        # /api/{version}/...: the segment after /api.
        path-segment: 1
      required: true
      # The only versions served. A version a mapping names stays unreachable until it is listed
      # here; any other is 400 API_VERSION_UNSUPPORTED.
      supported: v1
      detect-supported: false
  servlet:
    multipart:
      # No endpoint takes uploads: the resolver would parse every multipart body before the filters.
      enabled: false
  jackson:
    # A request body is read strictly: anything else is a 400 REQUEST_UNREADABLE, never silently
    # ignored or guessed at. A misspelt or unknown field first.
    deserialization:
      fail-on-unknown-properties: true
      fail-on-invalid-subtype: true
      accept-float-as-int: false
      wrap-exceptions: true
    mapper:
      allow-coercion-of-scalars: false
      accept-case-insensitive-enums: false
    # A value only in its documented form. Lenient, Jackson takes the day out of a date-time sent
    # for a date: "2026-04-01T18:30:00Z" is 2 April east of UTC, and 1 April would be stored.
    default-leniency: false
    datatype:
      enum:
        # An enum by its name, never by its position (0 for the first constant).
        fail-on-numbers-for-enums: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  # Behind the reverse proxy getRemoteAddr() is the real client.
  forward-headers-strategy: native
  compression:
    enabled: true
    min-response-size: 1KB
    mime-types: application/json,application/problem+json
  tomcat:
    threads:
      # Above the sum of the app.admission caps (checked at startup): a refused request still needs a
      # thread for its 503, and the actuator is never capped.
      max: ${TOMCAT_MAX_THREADS:100}
    connection-timeout: 5s
    max-connections: 5000
    accept-count: 1000
    keep-alive-timeout: 15s
    max-keep-alive-requests: 1000
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB
    max-http-response-header-size: 16KB
  max-http-request-header-size: 16KB
  servlet:
    encoding:
      force: true

# Off unless a profile turns them on (dev): a forgotten profile must not publish the API schema.
springdoc:
  # Annotation texts are published as written: with i18n on, springdoc resolves a description that is
  # one error code ("AUTHENTICATION_REQUIRED") as a message key and publishes the message instead.
  disable-i18n: true
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
