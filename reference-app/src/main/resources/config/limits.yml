# Every tunable limit in one place. Code names a limit; the number lives only here.
app:
  limits:
    # Offset-paged lists (bounded admin tables): page and size beyond these are a 400.
    offset-page:
      default-size: 20
      max-size: 100
      max-page: 100000
    # Cursor-paged lists and dropdowns: a batch beyond max-size is a 400.
    cursor-page:
      default-size: 20
      max-size: 100
    # @NotAfterToday: how many days past today (UTC) a calendar date may be. Every time zone is at
    # most 14 hours ahead of UTC, so 1 accepts every user's own today; clients check the exact day.
    not-after-today:
      tolerance-days: 1
    # Maximum lengths of text the API accepts, by field (@MaxLength("…") on request records).
    # The columns are text; these are the contract.
    text:
      search-query: 100
      # A cursor carries its sort keys as JSON, Base64url-encoded: up to 6 bytes per character of the
      # longest text key a cursor carries (a dropdown's label, a text sort key), since a control
      # character is escaped \u00XX and a 4-byte letter stays 4, plus about 100 bytes of frame (the
      # sort's name, the id), times 4/3: (6 x longest + 100) x 4/3. A new text key a cursor carries
      # raises it (LimitsIntegrationTest.CURSOR_TEXT_KEYS checks it).
      # example:begin
      # The example's longest such key is a todo list's name (100): 933.
      # example:end
      cursor: 1000
      user.email: 254
      user.full-name: 100
      user.refresh-token: 100
      # media:begin
      media.file-name: 255
      media.content-type: 100
      # An uploadKey a record attaches: <PURPOSE>/<uuid>, so a purpose name of up to 63 characters.
      # tenancy:begin
      # # With tenancy the key leads with the tenant: <tenantId>/<PURPOSE>/<uuid>, 74 characters beside the
      # # purpose, so 140 keeps a purpose name of up to 66 (100 would cap it at 26, and a longer purpose's
      # # keys could never be attached).
      # media.upload-key: 140
      # tenancy:else
      media.upload-key: 100
      # tenancy:end
      # media:end
      # example:begin
      todo-list.name: 100
      todo.title: 200
      todo.notes: 10000
      tag.name: 50
      time-entry.note: 500
      # example:end
    # media:begin
    # Upload policies an admin may set (PUT /upload-policies/{purpose}).
    upload-policy:
      # One presigned PUT carries at most 5 GiB (S3's limit for a single upload).
      max-size-bytes: 5368709120
      max-files: 50
      max-content-types: 20
    # media:end
    # Numbers the API accepts, by entity (@ConfiguredMax("<entity>.max-<field>") on request records),
    # and sizes of collections (@ConfiguredMaxSize("<entity>.max-<field>")). A new entity's section:
    #   <entity>:
    #     max-<field>: 100
    # example:begin
    time-entry:
      # Time logged in one entry, in minutes.
      max-minutes: 1440
    todo:
      # Tags on one todo (distinct ids, on create and on PUT /todos/{id}/tags).
      max-tags: 10
    todo-list-settings:
      # How long before a todo is due its reminder can go out, in minutes (TodoListSettings, configuration metadata).
      max-reminder-minutes: 1440
    # example:end
    # Latest dates the API accepts, by field (@LatestDate("…") on request records and filters). The
    # first one starts the section:
    #   latest-date:
    #     <entity>.<field>: "2999-12-31"
    # example:begin
    latest-date:
      # Must stay before 9999-12-31, the due_sort value that puts undated todos last (0003).
      todo.due-date: "2999-12-31"
      # Filters only: the entries themselves are bounded by @NotAfterToday.
      time-entry.spent-on: "2999-12-31"
      # Planned days lie ahead or behind, so no other bound fits; this one keeps dates sane.
      plan.dates: "2999-12-31"
    # example:end
    # Earliest dates the API accepts, by field (@EarliestDate("…")): a LocalDate reaches years
    # PostgreSQL's date can't hold, so every date that meets a column or a query has a floor. The
    # first one starts the section:
    #   earliest-date:
    #     <entity>.<field>: "1900-01-01"
    # example:begin
    earliest-date:
      todo.due-date: "1900-01-01"
      time-entry.spent-on: "1900-01-01"
      plan.dates: "1900-01-01"
    # example:end
  admission:
    # The `api` group: every API request outside the groups below (resilience4j.bulkhead.instances.api
    # reads these). At least twice the pool (checked at startup): tune with a load test.
    max-concurrent: ${ADMISSION_MAX_CONCURRENT:20}
    max-wait: 50ms
    groups:
      # Requests matching these path patterns take their permit from the bulkhead of that name.
      # The version segment is a wildcard, so a new API version is admitted the same way.
      # sign-in is the bcrypt endpoints only: refresh and logout stay in `api`, so a login storm
      # never refuses the token refresh of users already signed in.
      paths:
        sign-in:
          - /api/*/auth/login
          - /api/*/auth/signup
      # While refusing, at most one WARN per group per interval.
      warn-interval: 10s
  # How long a client is told to wait (jittered within the range) after a 503 or 429.
  retry-after:
    server-busy: { min: 1s, max: 3s }
    database-contention: { min: 1s, max: 3s }
    query-timeout: { min: 3s, max: 8s }
    database-unavailable: { min: 4s, max: 8s }
    # media:begin
    media-storage-unavailable: { min: 4s, max: 8s }
    # media:end
  # sign-in:begin
  rate-limit:
    enabled: true
    backend-timeout: 200ms
    # A bucket is deleted from Redis this long after it has refilled completely.
    expiry-grace: 10s
    # While Redis is unreachable, the background reconnect tries this often.
    reconnect-interval: 5s
    sign-in:
      login-per-ip: { requests: 20, window: 1m }
      login-per-account: { requests: 5, window: 1m }
      signup-per-ip: { requests: 5, window: 10m }
      refresh-per-ip: { requests: 30, window: 1m }
      logout-per-ip: { requests: 30, window: 1m }
  # sign-in:end

# The admission bulkheads (AdmissionControlFilter). Other bulkheads live beside the code they guard;
# Spring Boot merges the instances from every file.
resilience4j:
  bulkhead:
    instances:
      api:
        max-concurrent-calls: ${app.admission.max-concurrent}
        max-wait-duration: ${app.admission.max-wait}
      # Login and signup (app.admission.groups.paths.sign-in): bcrypt at cost 12 is about 250 ms of CPU
      # per sign-in, so a few per core is all the CPU holds. A cap of its own keeps a login storm from
      # taking the permits everything else needs.
      sign-in:
        max-concurrent-calls: ${ADMISSION_SIGN_IN_MAX_CONCURRENT:8}
        max-wait-duration: 500ms
