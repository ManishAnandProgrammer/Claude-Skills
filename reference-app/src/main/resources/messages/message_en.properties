# Shared bean validation messages ({key} in a constraint's message). Each block below holds one piece's
# error codes and its own bean validation messages.
max-length.nul-character=must not contain the NUL character
max-length.lone-surrogate=must not contain half of a character (a lone surrogate)
# metadata:begin
METADATA_KEY_UNKNOWN=No configuration is declared under this key.
METADATA_VALUE_MISSING=The configuration {0} has not been set up yet.
METADATA_KEY_TAKEN=This configuration already exists.
# metadata:end
# media:begin
UPLOAD_POLICY_NOT_SEEDED=No upload policy is set up for {0}.
UPLOAD_SIZE_OUT_OF_RANGE=The file {0} is {1} bytes; this upload takes {2} to {3} bytes.
UPLOAD_TYPE_NOT_ALLOWED=The content type {0} is not accepted for this upload.
UPLOAD_FILE_COUNT_OUT_OF_RANGE=This would make {0} files; between {1} and {2} are allowed.
UPLOAD_NOT_AVAILABLE=One or more uploads can''t be attached: they are unknown, already used, expired or not yours. Upload the files again.
MEDIA_STORAGE_UNAVAILABLE=File storage is temporarily unavailable. Please retry shortly.
upload-policy.size-range=minSizeBytes must not be above maxSizeBytes
upload-policy.file-range=minFiles must not be above maxFiles
# media:end
# example:begin
TODO_LIST_NOT_FOUND=No todo list was found with id {0}.
TODO_LIST_NAME_TAKEN=You already have a todo list with this name.
TODO_LIST_IN_USE=This todo list still has todos. Move or delete them first.
TODO_LIST_DELETED_MEANWHILE=The todo list was deleted while your change was being saved.
TODO_NOT_FOUND=No todo was found with id {0}.
TODO_NOT_YOURS=Todo {0} isn''t yours: you asked for it, so you may read it, but only its owner can change it.
TODO_IN_USE=This todo still has time entries or plans. Delete them first.
TODO_DELETED_MEANWHILE=The todo was deleted while your change was being saved.
TIME_ENTRY_NOT_FOUND=No time entry was found with id {0}.
TAG_NOT_FOUND=No tag was found with id {0}.
TAG_NAME_TAKEN=You already have a tag with this name.
TAG_DELETED_MEANWHILE=One of these tags was deleted while your change was being saved.
TAG_MERGE_INTO_ITSELF=Tag {0} can''t be merged into itself: name another tag as the source.
# media:begin
TODO_ATTACHMENT_NOT_FOUND=The file {0} is not attached to this todo.
# media:end
PLAN_NOT_FOUND=No plan was found with id {0}.
PLAN_OVERLAPS=You already have a plan on one or more of these days.
PLAN_TODO_DONE=Todo {0} is done: plan days only for an open todo.
PLAN_STATUS_CHANGE_INVALID=A {0} plan can''t become {1}.
PLAN_DONE_ON_BEFORE_STARTS_ON=A plan can''t be done on {0}, before its first day, {1}.
PLAN_DONE=Plan {0} is done: its days can''t change any more.
PLAN_CANCELLED=Plan {0} is cancelled: its days can''t change any more.
# The example's bean validation messages.
todo.due-filter-order=dueOnOrBefore needs sort DUE_DATE
time-entry.spent-on-range=spentOnFrom must not be after spentOnTo
time-entry.minutes-range=minMinutes must not be above maxMinutes
time-entry.spent-on-filter-order=spentOnFrom and spentOnTo need sort SPENT_ON
time-entry.minutes-filter-order=minMinutes and maxMinutes need sort MINUTES
plan.date-range=endsOn must not be before startsOn
plan.planned-range=plannedFrom must not be after plannedTo
plan.availability-range=to must not be before from
plan.planned-filter-order=plannedFrom and plannedTo need sort STARTS_ON
plan.done-on-with-done=doneOn comes with status DONE, and only with it
# example:end
