# Every message goes through MessageFormat (MessageSourceConfig): an apostrophe is written twice (can''t),
# a year or an id passed as a number is {0,number,#} (plain {0} prints 2026 as "2,026"), and a code answered
# from a constraint name takes no {0}: the handler has no argument to give it.
VALIDATION_FAILED=One or more fields failed validation. Please review the errors and correct your input.
REQUEST_UNREADABLE=The request body could not be read. Check that it is valid JSON with only the documented fields.
REQUEST_PARAMETER_MISSING=A required request parameter is missing.
REQUEST_PARAMETER_INVALID=A request parameter has an invalid value.
REQUEST_METHOD_NOT_ALLOWED=This method is not supported for this path.
REQUEST_MEDIA_TYPE_UNSUPPORTED=This content type is not supported. Send application/json.
REQUEST_NOT_ACCEPTABLE=The response can only be sent as JSON.
API_VERSION_UNSUPPORTED=This API version is missing, malformed or not supported. Use a version listed in the API documentation.
REQUEST_INVALID=The request is not valid.
RESOURCE_NOT_FOUND=No such resource.
AUTHENTICATION_REQUIRED=Authentication is required. Please sign in.
ACCESS_DENIED=You do not have permission to perform this action.
DROPDOWN_REACH_UNSUPPORTED=These options can''t be listed for that permission: it reaches records this list doesn''t offer.
RATE_LIMITED=Too many requests. Please wait before trying again.
CORS_REQUEST_REFUSED=Cross-origin requests from this origin, or with this method or these headers, are not allowed.
DUPLICATE_RECORD=A record with this value already exists.
OPTIMISTIC_LOCK_CONFLICT=This record was changed by another request. Reload it and try again.
DATA_INTEGRITY_ERROR=Something went wrong on our end. Please try again in a few moments.
DATABASE_CONTENTION=The data is busy with another request. Please retry shortly.
QUERY_TIMEOUT=The request took too long to complete. Please retry shortly.
DATABASE_UNAVAILABLE=The service is temporarily unavailable. Please retry shortly.
SERVER_BUSY=The service is busy. Please retry shortly.
UNEXPECTED_ERROR=Something went wrong on our end. Please try again in a few moments.
USER_NOT_FOUND=The account no longer exists.
USER_EMAIL_TAKEN=An account with this email already exists.
USER_PASSWORD_BREACHED=This password has appeared in a data breach. Choose a different one.
USER_PASSWORD_INCORRECT=The current password is not correct.
