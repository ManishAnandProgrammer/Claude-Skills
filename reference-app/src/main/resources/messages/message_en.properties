# Every message goes through MessageFormat (MessageSourceConfig): an apostrophe is written twice (can''t),
# a year or an id passed as a number is {0,number,#} (plain {0} prints 2026 as "2,026"), and a code answered
# from a constraint name takes no {0}: the handler has no argument to give it.
VALIDATION_FAILED=One or more fields failed validation. Please review the errors and correct your input.
REQUEST_UNREADABLE=The request body could not be read. Check that it is valid JSON with only the documented fields.
REQUEST_PARAMETER_MISSING=A required request parameter is missing.
REQUEST_PARAMETER_INVALID=A request parameter has an invalid value.
REQUEST_METHOD_NOT_ALLOWED=This method is not supported for this path.
REQUEST_MEDIA_TYPE_UNSUPPORTED=This content type is not supported. Send application/json.
REQUEST_NOT_ACCEPTABLE=The response can only be sent as JSON.
API_VERSION_UNSUPPORTED=This API version is missing, malformed or not supported. Use a version listed in the API documentation.
REQUEST_INVALID=The request is not valid.
RESOURCE_NOT_FOUND=No such resource.
AUTHENTICATION_REQUIRED=Authentication is required. Please sign in.
ACCESS_DENIED=You do not have permission to perform this action.
RATE_LIMITED=Too many requests. Please wait before trying again.
DUPLICATE_RECORD=A record with this value already exists.
OPTIMISTIC_LOCK_CONFLICT=This record was changed by another request. Reload it and try again.
DATA_INTEGRITY_ERROR=Something went wrong on our end. Please try again in a few moments.
DATABASE_CONTENTION=The data is busy with another request. Please retry shortly.
QUERY_TIMEOUT=The request took too long to complete. Please retry shortly.
DATABASE_UNAVAILABLE=The service is temporarily unavailable. Please retry shortly.
SERVER_BUSY=The service is busy. Please retry shortly.
UNEXPECTED_ERROR=Something went wrong on our end. Please try again in a few moments.
USER_NOT_FOUND=The account no longer exists.
USER_EMAIL_TAKEN=An account with this email already exists.
USER_PASSWORD_BREACHED=This password has appeared in a data breach. Choose a different one.
AUTH_INVALID_CREDENTIALS=Invalid email or password.
AUTH_INVALID_REFRESH_TOKEN=The refresh token is invalid or expired. Please sign in again.
# Bean validation messages ({key} in a constraint's message), shared ones here, each module's below.
max-length.nul-character=must not contain the NUL character
# metadata:begin
METADATA_KEY_UNKNOWN=No configuration is declared under this key.
METADATA_NOT_FOUND=The configuration {0} has not been set up yet.
METADATA_KEY_TAKEN=This configuration already exists.
# metadata:end
# media:begin
UPLOAD_POLICY_NOT_FOUND=No upload policy is set up for {0}.
UPLOAD_SIZE_OUT_OF_RANGE=The file {0} is {1} bytes; this upload takes {2} to {3} bytes.
UPLOAD_TYPE_NOT_ALLOWED=The content type {0} is not accepted for this upload.
UPLOAD_FILE_COUNT_OUT_OF_RANGE=This would make {0} files; between {1} and {2} are allowed.
UPLOAD_NOT_AVAILABLE=One or more uploads can''t be attached: they are unknown, already used, expired or not yours. Upload the files again.
MEDIA_STORAGE_UNAVAILABLE=File storage is temporarily unavailable. Please retry shortly.
upload-policy.size-range=minSizeBytes must not be above maxSizeBytes
upload-policy.file-range=minFiles must not be above maxFiles
# media:end
# example:begin
TODO_LIST_NOT_FOUND=No todo list was found with id {0}.
TODO_LIST_NAME_TAKEN=You already have a todo list with this name.
TODO_LIST_IN_USE=This todo list still has todos. Move or delete them first.
TODO_LIST_GONE=The todo list was deleted while your change was being saved.
TODO_NOT_FOUND=No todo was found with id {0}.
TODO_IN_USE=This todo still has time entries or plans. Delete them first.
TODO_GONE=The todo was deleted while your change was being saved.
TIME_ENTRY_NOT_FOUND=No time entry was found with id {0}.
TAG_NOT_FOUND=No tag was found with id {0}.
TAG_NAME_TAKEN=You already have a tag with this name.
TAG_GONE=One of these tags was deleted while your change was being saved.
# media:begin
TODO_ATTACHMENT_NOT_FOUND=The file {0} is not attached to this todo.
# media:end
PLAN_NOT_FOUND=No plan was found with id {0}.
PLAN_OVERLAPS=You already have a plan on one or more of these days.
# The example's bean validation messages.
time-entry.spent-on-range=spentOnFrom must not be after spentOnTo
time-entry.minutes-range=minMinutes must not be above maxMinutes
plan.date-range=endsOn must not be before startsOn
# example:end
