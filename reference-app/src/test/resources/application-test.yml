# Connections come from Testcontainers (@ServiceConnection), which overrides these.
spring:
  datasource:
    username: test
    password: test
  jpa:
    properties:
      hibernate:
        # For the query-count tests (IntegrationTest#statistics).
        generate_statistics: true
app:
  jwt:
    secret: test-secret-that-is-at-least-thirty-two-bytes-long
  security:
    personal-data-pepper: test-pepper-that-is-at-least-thirty-two-bytes
  cors:
    allowed-origins: http://localhost:3000
  # sign-in:begin
  # The sign-in limits are production's (config/limits.yml). Each MockMvc request comes from its own
  # client address (support/DistinctClientAddresses), as each test uses its own accounts, so no test
  # trips a limit another test used; the rate-limit tests pin one address to trip a per-IP limit.
  # sign-in:end
  admission:
    max-concurrent: 200
springdoc:
  api-docs:
    enabled: true
management:
  # Same port as the application, so MockMvc reaches the actuator. StartupChecks allows this only
  # when the test profile is the only one active.
  server:
    port: 8080
server:
  port: 8080
