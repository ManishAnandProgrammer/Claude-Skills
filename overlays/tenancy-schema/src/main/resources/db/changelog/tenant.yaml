# Schema per tenant: every tenant's changelog, run into each tenant schema and the tenant_template by
# the tenant migrations (TenantProvisioningJob for a new schema, TenantMigrations at deploy), never by
# Spring. A changeset is identified by its id, author and file path: never move one between files.
databaseChangeLog:
  - include:
      file: changes/0002-todo-lists.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0003-todos.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0004-tags.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0005-time-entries.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0006-todo-tags.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0008-configuration-metadata.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0009-media-files.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0010-todo-attachments.sql
      relativeToChangelogFile: true
  - include:
      file: changes/0014-todo-list-defaults.sql
      relativeToChangelogFile: true
