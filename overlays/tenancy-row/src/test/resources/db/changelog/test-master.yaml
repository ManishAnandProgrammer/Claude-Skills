# The changelog in tests: the application's, then the row-mode tests' probe tables (a project without
# the example module may have no tenant table of its own yet). config/tenancy-test.yml points here.
databaseChangeLog:
  - include:
      file: db/changelog/db.changelog-master.yaml
  - include:
      file: db/changelog/test-changes/tenancy-probe.sql
